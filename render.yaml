services:
  # Express + Socket.IO API (npm workspace: server)
  - type: web
    name: quizly-server
    runtime: node
    buildCommand: >-
      npm install &&
      npm run build --workspace=shared &&
      npm exec --workspace=server -- prisma generate &&
      npm exec --workspace=server -- prisma migrate deploy &&
      npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /
    buildFilter:
      paths:
        - server/**
        - shared/**
      ignoredPaths:
        - client/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_FRONTEND_URL
        sync: false # set to the quizly-client URL, e.g. https://quizly-client.onrender.com
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # React + Vite static frontend (npm workspace: client)
  - type: web
    name: quizly-client
    runtime: static
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=client
    staticPublishPath: client/dist
    buildFilter:
      paths:
        - client/**
        - shared/**
      ignoredPaths:
        - server/**
    routes:
      # Client-side routing (React Router) — serve index.html for any
      # unmatched path so direct loads/refreshes on deep links don't 404.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # set to the quizly-server URL, e.g. https://quizly-server.onrender.com
      - key: VITE_SOCKET_URL
        sync: false # same value as VITE_API_URL
